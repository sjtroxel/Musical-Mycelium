# Local guardrails. Install once with `uv run pre-commit install`.
# Deliberately fast: formatting, lint, and the leak-prevention checks only.
# Types and tests run in `make check` and in CI, not on every commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

# Deliberately NOT included: no-commit-to-branch. This is a solo repo and he commits directly to main;
# a hook that blocks every commit on the only branch he uses would just get uninstalled.
