<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The mark is three noteheads on a beam: the real blues -> blues rock -> heavy metal
         component, which is the whole of that chip's island in artifact v0.5.0. See
         src/components/mark.ts. The .ico is for the browsers that still ask for one by name. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0a14" />
    <title>Musical Mycelium</title>
    <meta
      name="description"
      content="A goal-directed research agent that maps the history of music. Every claim traces to a checkable source."
    />

    <!-- Link-preview tags, phase 7.5 step 5. Without these, pasting the URL into LinkedIn, Slack or
         anywhere else produces a title-only card with no image, which is what happened when the
         Musical Mycelium card went onto a LinkedIn profile on 2026-09-15.

         The URLs are ABSOLUTE and point at the vercel.app host rather than being relative or pointing
         at CloudFront. Two reasons: og:image is specified as an absolute URL and most crawlers will
         not resolve a relative one, and musical-mycelium.vercel.app is the address the project
         publishes everywhere. `infra/vercel/vercel.json` rewrites every path to the distribution, so
         /og/card.jpg resolves through the proxy exactly as the app does.

         og:image is a JPEG, not the 804 KB source PNG in the job-search repo. See the `social` entry
         in web/scripts/asset-budget.mjs for why the size matters here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Musical Mycelium" />
    <meta property="og:url" content="https://musical-mycelium.vercel.app/" />
    <meta property="og:title" content="Musical Mycelium" />
    <meta
      property="og:description"
      content="A goal-directed research agent that maps the history of music. Every claim traces to a checkable source."
    />
    <meta property="og:image" content="https://musical-mycelium.vercel.app/og/card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Musical Mycelium: music history is a network, not a timeline. Every connection traces to a checkable source."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Musical Mycelium" />
    <meta
      name="twitter:description"
      content="A goal-directed research agent that maps the history of music. Every claim traces to a checkable source."
    />
    <meta name="twitter:image" content="https://musical-mycelium.vercel.app/og/card.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
