# Keeps the pinned CI actions and Python dependencies from going stale.
# Monthly, grouped, so it is one reviewable PR rather than a stream of noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
