name: CI

on:
  push:
    branches: [main]
  pull_request:

  # Manual trigger, added 2026-08-06 during a GitHub Actions incident that throttled webhook delivery:
  # push events registered on the repository but started no runs, for hours, with nothing wrong on this
  # side. Without this, the only way to re-run CI is an empty commit — which also depends on the
  # webhook that is broken. `workflow_dispatch` is not a webhook trigger and kept working throughout;
  # two manual deploys went out while every push-triggered run was silently dropped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not @v9: setup-uv does not publish a floating major tag, so @v9 fails to resolve.
        # Dependabot keeps this current.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      # --locked fails the build if uv.lock is out of date with pyproject.toml,
      # rather than silently resolving something different from local dev.
      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy

      # Integration tests touch real services and billable calls; they never run unattended.
      - name: Tests
        run: uv run pytest -m "not integration and not costs_money"

      # Tier 1 over the gold set, driven by ScriptedLLM against the pinned artifact. $0, no AWS, no
      # credentials, and it runs on every commit as DoD 1 requires.
      #
      # It REPORTS rather than blocks, and that is phase 4 step 3 rather than an oversight: blocking
      # arrives in step 5 from thresholds written out of step 4's real-model baseline, and
      # .claude/rules/evals.md forbids inventing a threshold before a baseline exists. The assertions
      # that DO block already ran in the test step above.
      #
      # The output marks traversal_recall, traversal_precision and plan_adherence SCRIPT-DETERMINED.
      # Do not quote those from a CI log as agent behaviour; they are decided by eval/gold.py's trace.
      - name: Tier 1 eval (scripted, free)
        run: make eval

  # The SPA, added at phase 5 step 2. A separate job rather than a step in `check` because it shares
  # nothing with the Python toolchain — no uv, no venv — and a frontend failure should not read as a
  # backend one in the checks list.
  #
  # `npm ci` rather than `npm install`: it fails when package-lock.json is out of date with
  # package.json instead of silently resolving something different from local dev, which is the same
  # property `uv sync --locked` gives the Python half above.
  web:
    name: spa types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Types, unit tests and the production build. The build is not ceremony: `tsc` and Vite disagree
      # about what resolves, and a green test run over a bundle that will not build is a deploy that
      # fails in `deploy.yml` instead of here.
      - name: Check
        run: npm run check

  root-hygiene:
    name: repo root cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check root entry count
        run: make root-check

  # Runs on every commit and needs NO AWS credentials: `-backend=false` skips backend initialisation,
  # which is the only part of `init` that authenticates. So a syntax error, a bad reference, or an
  # unformatted file is caught here rather than at 2am against a real account.
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate every root
        run: |
          set -euo pipefail
          for dir in infra/terraform/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done
